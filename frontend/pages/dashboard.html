<!DOCTYPE html>
<html><head>
<script src="https://cdn.tailwindcss.com"></script>
<title>Dashboard</title></head>
<body class="bg-slate-100">
<div
    id="loader"
    class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50"
>
    <div
        class="w-16 h-16 border-4 border-white border-t-transparent rounded-full animate-spin"
    ></div>
</div>
<div class="p-6">
<div class="flex justify-between mb-4">
<h1 class="text-3xl font-bold">Dashboard</h1>
<div>
<button onclick="toggleTheme()" class="bg-gray-700 text-white px-3 py-2 rounded">Theme</button>
<button onclick="logout()" class="bg-red-600 text-white px-3 py-2 rounded">Logout</button>
</div>
</div>
<div id="roleBadge" class="mb-4"></div>
<table class="bg-white w-full shadow rounded">
<thead><tr><th class='p-2'>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
<tbody id="users"></tbody>
</table>
</div>
<script src="../js/dashboard.js"></script>
</body></html>
